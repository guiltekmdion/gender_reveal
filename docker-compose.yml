version: '3.8'

services:
  gender-reveal-app:
    container_name: gender-reveal-app
    build:
      context: .
      dockerfile: Dockerfile
      # Optimisations pour Portainer CI/CD
      args:
        - BUILDKIT_INLINE_CACHE=1
      # Utiliser le cache Docker si disponible
      cache_from:
        - gender-reveal-app:latest
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - JWT_SECRET=${JWT_SECRET:-change-this-secret-key}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-https://gender.guiltek.cloud}
      - STORAGE_TYPE=${STORAGE_TYPE:-file}
      - DATABASE_PATH=${DATABASE_PATH:-./data/gender_reveal.db}
      - PORT=3000
      - HOSTNAME=0.0.0.0
    volumes:
      - gender_reveal_data:/app/data
    networks:
      - proxy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/config"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      # Traefik configuration
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      
      # HTTP Router (Port 80) - Redirect to HTTPS
      - "traefik.http.routers.gender-reveal-http.rule=Host(`gender.guiltek.cloud`)"
      - "traefik.http.routers.gender-reveal-http.entrypoints=web"
      - "traefik.http.routers.gender-reveal-http.middlewares=https-redirect"
      - "traefik.http.middlewares.https-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.https-redirect.redirectscheme.permanent=true"

      # HTTPS Router (Port 443)
      - "traefik.http.routers.gender-reveal.rule=Host(`gender.guiltek.cloud`)"
      - "traefik.http.routers.gender-reveal.entrypoints=websecure"
      - "traefik.http.routers.gender-reveal.tls=true"
      - "traefik.http.routers.gender-reveal.tls.certresolver=myresolver"
      - "traefik.http.routers.gender-reveal.service=gender-reveal"
      
      # Service definition
      - "traefik.http.services.gender-reveal.loadbalancer.server.port=3000"
      
      # Security headers middleware
      - "traefik.http.middlewares.gender-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.gender-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.gender-headers.headers.stsPreload=true"
      - "traefik.http.middlewares.gender-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.gender-headers.headers.browserXssFilter=true"
      - "traefik.http.middlewares.gender-headers.headers.frameDeny=true"
      - "traefik.http.routers.gender-reveal.middlewares=gender-headers"
      
      # Portainer labels
      - "com.portainer.label.name=Gender Reveal App"
      - "com.portainer.label.description=Application de révélation de genre pour bébé"
      - "com.portainer.label.category=Web Application"
      - "com.docker.stack.namespace=gender-reveal"
      - "io.portainer.access.control=public"

volumes:
  gender_reveal_data:
    driver: local
    name: gender_reveal_data

networks:
  proxy:
    external: true
    name: proxy
